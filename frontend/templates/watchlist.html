{% extends "base.html" %}

{% block title %}CQ — My Watchlist{% endblock %}

{% block content %}

<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px;">
  <div>
    <h1 style="font-size: 42px; line-height: 1; margin-bottom: 4px;">MY WATCHLIST</h1>
    <p style="color: var(--text-secondary); font-size: 14px;" id="watchlist-count-text">Saved movies to watch later</p>
  </div>
</div>

<div class="movie-grid" id="watchlist-grid">
  <!-- Dynamically loaded -->
</div>

{% endblock %}

{% block extra_scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    loadWatchlistGrid();
  });

  async function loadWatchlistGrid() {
    try {
      const res = await fetch('/api/watchlist');
      const data = await res.json();
      
      const grid = document.getElementById('watchlist-grid');
      const countText = document.getElementById('watchlist-count-text');
      
      countText.innerText = `${data.count} Saved Movie${data.count === 1 ? '' : 's'}`;
      
      if (data.watchlist && data.watchlist.length > 0) {
        grid.innerHTML = data.watchlist.map(m => createMovieCard(m, { why: false })).join('');
      } else {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; background: var(--bg-surface); border-radius: 16px; border: 1px dashed var(--border);">
            <div style="font-size: 48px; margin-bottom: 12px;">🎬</div>
            <h3 style="font-size: 22px; margin-bottom: 8px;">Your Watchlist is Empty</h3>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px;">Explore recommendations and add movies to your personal watchlist.</p>
            <a href="/home" class="btn btn-primary">Browse Movies</a>
          </div>
        `;
      }
    } catch (e) {
      console.error('Error loading watchlist grid', e);
    }
  }
</script>
{% endblock %}
